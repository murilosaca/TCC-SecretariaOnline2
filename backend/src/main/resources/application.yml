spring:
  application:
    name: secretaria-online-2
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/secretaria_dev}
    username: ${SPRING_DATASOURCE_USERNAME:secretaria}
    password: ${SPRING_DATASOURCE_PASSWORD:localdev}
    hikari:
      pool-name: SecretariaHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  iam:
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
    reset-ttl-seconds: 86400
    cookie-name: so2_refresh
    cookie-secure: ${IAM_COOKIE_SECURE:false}
    cookie-same-site: Lax
    issuer: so2
    audience: so2-api
    reset-audience: password-reset
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    jwt-private-key-pem: ${JWT_RSA_PRIVATE_KEY:}
    jwt-public-key-pem: ${JWT_RSA_PUBLIC_KEY:}
    max-falhas-consecutivas: 10
    minutos-bloqueio: 15
    login-por-minuto: 5
    recuperar-por-hora: 3
    argon2:
      salt-length: 16
      hash-length: 32
      parallelism: 1
      memory-kb: ${IAM_ARGON2_MEMORY_KB:48128}
      iterations: ${IAM_ARGON2_ITERATIONS:1}
    seed:
      enabled: ${IAM_DEV_SEED:true}
      password: ${IAM_DEV_SEED_PASSWORD:}
  eventos:
    dev-pin: ${EVENT_DEV_PIN:123456}
  contato:
    nome: ${APP_CONTATO_NOME:Secretaria SEPT — UFPR}
    endereco: ${APP_CONTATO_ENDERECO:Rua Dr. Alcides Vieira Arcoverde, 1225 — Jardim das Américas, Curitiba/PR}
    telefone: ${APP_CONTATO_TELEFONE:(41) 3360-4900}
    email: ${APP_CONTATO_EMAIL:secretaria.sept@ufpr.br}
    horario: ${APP_CONTATO_HORARIO:Segunda a sexta, 8h–17h}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    enabled: true

logging:
  level:
    root: INFO
    br.ufpr.sept.so2: DEBUG
