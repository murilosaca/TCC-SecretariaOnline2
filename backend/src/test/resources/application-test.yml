spring:
  datasource:
    url: jdbc:h2:mem:so2;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS citext AS varchar\;CREATE DOMAIN IF NOT EXISTS jsonb AS varchar
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  iam:
    cookie-secure: false
    argon2:
      memory-kb: 8192
      iterations: 1
    seed:
      enabled: false
      password:
