services:
  postgres:
    image: postgres:16-alpine
    container_name: so2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: secretaria_dev
      POSTGRES_USER: secretaria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretaria -d secretaria_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: so2_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: so2_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: so2_minio_init
    depends_on:
      minio:
        condition: service_started
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-so2}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$STORAGE_ACCESS_KEY\" \"$$STORAGE_SECRET_KEY\"; do sleep 1; done;
      mc mb --ignore-existing local/$$STORAGE_BUCKET;
      mc anonymous set none local/$$STORAGE_BUCKET;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
